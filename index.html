<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official result archive of the Vishwaniketan Department of Examination Cell.">
    <title>Vishwaniketan | Examination Cell</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="site-brand">
                <img class="college-logo" src="vishwaniketan.png" alt="Vishwaniketan logo" width="96" height="96">
                <div>
                    <p class="college-label">Official Examination Portal</p>
                    <h1>VISHWANIKETAN</h1>
                    <p class="site-subtitle">Department of Examination Cell</p>
                </div>
            </div>
        </div>
    </header>

    <main class="container page-layout">
        <section class="results-section" aria-labelledby="results-heading">
            <div class="section-heading">
                <h2 id="results-heading">Latest Results</h2>
                <form class="search-form" action="#" role="search">
                    <label class="visually-hidden" for="blog-search">Search examination results</label>
                    <input id="blog-search" type="search" placeholder="Search results">
                    <button type="submit">Search</button>
                </form>
                <span class="result-count" id="latest-result-count">60 Results</span>
            </div>

            <ul class="result-list" id="latest-results"></ul>
        </section>

        <aside class="sidebar" aria-label="Blog archive">
            <nav class="sidebar-section archive" aria-labelledby="archive-heading">
                <h2 id="archive-heading">Blog Archive</h2>
                <div class="archive-links">
                    <a href="results/2026.html">2026</a>
                    <a href="results/2025.html">2025</a>
                    <a href="results/2024.html">2024</a>
                    <a href="results/2023.html">2023</a>
                    <a href="results/2022.html">2022</a>
                    <a href="results/2021.html">2021</a>
                    <a href="results/2020.html">2020</a>
                    <a href="results/2019.html">2019</a>
                    <a href="results/2018.html">2018</a>
                    <a href="results/2017.html">2017</a>
                </div>
            </nav>
        </aside>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Vishwaniketan Department of Examination Cell</p>
        </div>
    </footer>
    <script src="data/results-2026.js"></script>
    <script>
        function displayDate(value) {
            if (!value) {
                return 'Date not available';
            }
            var parts = value.slice(0, 10).split('-').map(Number);
            return new Intl.DateTimeFormat('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                timeZone: 'UTC'
            }).format(new Date(Date.UTC(parts[0], parts[1] - 1, parts[2])));
        }

        var latestResults = document.getElementById('latest-results');
        var resultCount = document.getElementById('latest-result-count');
        var searchForm = document.querySelector('.search-form');
        var searchInput = document.getElementById('blog-search');

        function updateResultCount(visibleResults) {
            resultCount.textContent = visibleResults + (visibleResults === 1 ? ' Result' : ' Results');
        }

        window.results2026.forEach(function (record) {
            var item = document.createElement('li');
            var article = document.createElement('article');
            var title = document.createElement('h2');
            var date = document.createElement('p');
            var time = document.createElement('time');
            var link = document.createElement('a');

            item.className = 'result-item';
            title.textContent = record.title;
            date.className = 'result-date';
            if (record.date) {
                time.dateTime = record.date;
            }
            time.textContent = displayDate(record.date);
            link.className = 'result-link';
            link.href = record.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = 'Click here to see the Result';
            date.appendChild(time);
            article.append(title, date, link);
            item.appendChild(article);
            latestResults.appendChild(item);
        });

        function filterResults() {
            var query = searchInput.value.trim().toLowerCase();
            var visibleResults = 0;

            latestResults.querySelectorAll('.result-item').forEach(function (item) {
                var matches = item.textContent.toLowerCase().includes(query);
                item.hidden = !matches;
                if (matches) {
                    visibleResults += 1;
                }
            });

            updateResultCount(visibleResults);
        }

        searchForm.addEventListener('submit', function (event) {
            event.preventDefault();
            filterResults();
        });
        searchInput.addEventListener('input', filterResults);
        updateResultCount(window.results2026.length);
    </script>
</body>
</html>
