<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Examination Results | Vishwaniketan</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="site-header"><div class="container"><p class="college-label">Official Examination Portal</p><h1>VISHWANIKETAN</h1><p class="site-subtitle">Department of Examination Cell</p></div></header>
    <main class="container year-page">
        <section class="results-section">
            <div class="section-heading"><h2>Examination Results — 2026</h2><span class="result-count" id="result-count">60 Results</span></div>
            <ul class="year-result-list" id="results-2026"></ul>
        </section>
    </main>
    <footer class="site-footer"><div class="container"><p>&copy; 2026 Vishwaniketan Department of Examination Cell</p></div></footer>
    <script src="../data/results-2026.js"></script>
    <script>
        function displayDate(value) {
            var parts = value.slice(0, 10).split('-').map(Number);
            return new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(parts[0], parts[1] - 1, parts[2])));
        }
        var resultList = document.getElementById('results-2026');
        document.getElementById('result-count').textContent = window.results2026.length + ' Results';
        window.results2026.forEach(function (record) {
            var item = document.createElement('li');
            var title = document.createElement('a');
            var date = document.createElement('time');
            item.className = 'year-result-item';
            title.className = 'year-result-title';
            title.textContent = record.title;
            title.href = record.url;
            title.target = '_blank';
            title.rel = 'noopener noreferrer';
            date.className = 'year-result-date';
            date.dateTime = record.date;
            date.textContent = displayDate(record.date);
            item.append(title, date);
            resultList.appendChild(item);
        });
    </script>
</body>
</html>
