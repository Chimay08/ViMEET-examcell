<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>2018 Examination Results | Vishwaniketan</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="../favicon.png"><link rel="stylesheet" href="../style.css"></head>
<body>
    <header class="site-header"><div class="container"><div class="site-brand"><img class="college-logo" src="../vishwaniketan.png" alt="Vishwaniketan logo" width="96" height="96"><div><p class="college-label">Official Examination Portal</p><h1>VISHWANIKETAN</h1><p class="site-subtitle">Department of Examination Cell</p></div></div></div></header>
    <main class="container year-page">
        <section class="results-section">
            <div class="section-heading">
                <h2>Examination Results — 2018</h2>
                <span class="result-count" id="result-count">154 Results</span>
            </div>
            <ul class="year-result-list" id="results-2018"></ul>
        </section>
    </main>
    <footer class="site-footer"><div class="container"><p>&copy; 2026 Vishwaniketan Department of Examination Cell</p></div></footer>
    <script src="../data/results-2018.js"></script>
    <script>
        function displayDate(value) {
            var parts = value.slice(0, 10).split('-').map(Number);
            return new Intl.DateTimeFormat('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                timeZone: 'UTC'
            }).format(new Date(Date.UTC(parts[0], parts[1] - 1, parts[2])));
        }

        var resultList = document.getElementById('results-2018');
        document.getElementById('result-count').textContent = window.results2018.length + ' Results';

        window.results2018.forEach(function (record) {
            var item = document.createElement('li');
            var titleElement = document.createElement('a');
            var dateElement = document.createElement('time');

            item.className = 'year-result-item';
            titleElement.className = 'year-result-title';
            titleElement.textContent = record.title;
            titleElement.href = record.url;
            titleElement.target = '_blank';
            titleElement.rel = 'noopener noreferrer';
            dateElement.className = 'year-result-date';
            dateElement.dateTime = record.date;
            dateElement.textContent = displayDate(record.date);
            item.append(titleElement, dateElement);
            resultList.appendChild(item);
        });
    </script>
</body>
</html>
