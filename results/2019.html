<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2019 examination results from Vishwaniketan Department of Examination Cell.">
    <title>2019 Examination Results | Vishwaniketan</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <p class="college-label">Official Examination Portal</p>
            <h1>VISHWANIKETAN</h1>
            <p class="site-subtitle">Department of Examination Cell</p>
        </div>
    </header>

    <main class="container year-page">
        <section class="results-section" aria-labelledby="results-heading">
            <div class="section-heading">
                <h2 id="results-heading">Examination Results &mdash; 2019</h2>
                <span class="result-count" id="result-count">213 Results</span>
            </div>
            <ul class="year-result-list" id="results-2019"></ul>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Vishwaniketan Department of Examination Cell</p>
        </div>
    </footer>

    <script src="../data/results-2019.js"></script>
    <script>
        function displayDate(value) {
            var parts = value.slice(0, 10).split('-').map(Number);
            return new Intl.DateTimeFormat('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                timeZone: 'UTC'
            }).format(new Date(Date.UTC(parts[0], parts[1] - 1, parts[2])));
        }

        var resultList = document.getElementById('results-2019');
        document.getElementById('result-count').textContent = window.results2019.length + ' Results';

        window.results2019.forEach(function (record) {
            var item = document.createElement('li');
            var titleElement = document.createElement('a');
            var dateElement = document.createElement('time');

            item.className = 'year-result-item';
            titleElement.className = 'year-result-title';
            titleElement.textContent = record.title;
            titleElement.href = record.url;
            titleElement.target = '_blank';
            titleElement.rel = 'noopener noreferrer';
            dateElement.className = 'year-result-date';
            dateElement.dateTime = record.date;
            dateElement.textContent = displayDate(record.date);
            item.append(titleElement, dateElement);
            resultList.appendChild(item);
        });
    </script>
</body>
</html>
